name: CI (macOS)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        # PRs run Debug only for fast feedback; main runs both. Release-only
        # bugs are rare (no LTO here, NDEBUG only deletes asserts) and get
        # caught post-merge on the full main-branch matrix.
        build_type: ${{ github.event_name == 'pull_request' && fromJSON('["Debug"]') || fromJSON('["Debug", "Release"]') }}

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: show compiler version
        run: /usr/bin/clang++ --version

      - name: install htslib
        run: brew install htslib

      - name: configure cmake
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            -DBUILD_CLI=ON \
            -S ${{ github.workspace }}

      - name: build
        run: cmake --build build --parallel

      - name: test
        working-directory: build
        run: ctest --output-on-failure
