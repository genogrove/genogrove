name: Continuous Benchmarking

on:
  push:
    branches:
      - main

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhts-dev

      - name: Configure CMake with benchmarks
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARKS=ON \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build benchmarks
        run: cmake --build build --config Release

      - name: Copy benchmark data files
        run: |
          mkdir -p build/benchmarks/data
          cp benchmarks/data/*_intervals_*.txt build/benchmarks/data/

      # Three repetitions at 0.25s each costs the same wall time as the single
      # 0.5s run this replaced, but gives three samples to pick from instead of
      # trusting one. reduce_repetitions.py then keeps the fastest sample per
      # benchmark: a slow sample means something else on the shared runner
      # interfered, and that is noise, not a slower library.
      - name: Run benchmarks
        run: |
          cd build/benchmarks
          ./genogrove_benchmarks \
            --benchmark_repetitions=3 \
            --benchmark_min_time=0.25s \
            --benchmark_out=benchmark_raw.json \
            --benchmark_out_format=json
          cd ../..

      - name: Reduce repetitions to the fastest sample per benchmark
        run: |
          python3 benchmarks/reduce_repetitions.py \
            build/benchmarks/benchmark_raw.json \
            build/benchmarks/benchmark_result.json

      - name: Set up Python for visualizations
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install matplotlib seaborn

      - name: Generate visualization plots
        run: |
          mkdir -p build/benchmarks/plots
          python benchmarks/visualize.py \
            build/benchmarks/benchmark_result.json \
            build/benchmarks/plots

      - name: Deploy custom benchmarks to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/benchmarks/plots
          destination_dir: benchmarks
          keep_files: true

      - name: Store benchmark result
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: C++ Benchmark
          tool: 'googlecpp'
          output-file-path: build/benchmarks/benchmark_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Only keep the last 25 commits in the chart
          max-items-in-chart: 25
          # No alert from this chart. It compares a commit against its
          # predecessor measured on whichever shared runner each one drew, and
          # those runners are different CPU models, not just different speeds:
          # one class has 4x the L2 cache of another, so the grove working set
          # stays in L2 there and every tree benchmark runs ~2x faster while
          # the 4 MiB control chase runs ~3x slower. No scalar normalisation
          # cancels that. The alert fired three times on untouched code and
          # never on a real regression (#518 reached main under it). The PR
          # A/B job holds the host constant and is the only alert (#574).
          comment-on-alert: false
          fail-on-alert: false
          gh-repository: 'github.com/genogrove/genogrove'